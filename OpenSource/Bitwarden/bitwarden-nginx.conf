# Bitwarden reverse proxy.
#
# Bitwarden ships its own nginx container (ghcr.io/bitwarden/nginx) that
# routes /api, /identity, /notifications, /events, /icons, /admin, ... to the
# individual services. In this setup that container runs plain HTTP only
# (config.yml: ssl: false) and is published on 127.0.0.1:<port> — see
# bitwarden-docker-install.sh. This host vhost is the single public entry
# point: it terminates TLS and forwards everything to that container, which
# is Bitwarden's documented "behind a proxy" layout.
#
# Bitwarden requires a consistent scheme: the vault URL is https://, so this
# vhost must always send X-Forwarded-Proto https.
#
# Placeholders bitwarden.example.com and 127.0.0.1:8086 are substituted by
# bitwarden-docker-install.sh. Edit them by hand if configuring Nginx
# separately.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name bitwarden.example.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/bitwarden.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bitwarden.example.com/privkey.pem;
    #include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Bitwarden's own nginx sets CSP, X-Frame-Options, X-Content-Type-Options
    # and Referrer-Policy (and, with ssl: false, no HSTS) — only HSTS is added
    # here so no header is sent twice.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Attachments/Sends: Bitwarden's inner nginx allows 505m; stay just above
    # so the inner limit (and its error) is the one users hit.
    client_max_body_size 525m;

    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;

        # WebSocket upgrade for /notifications/hub (SignalR live sync).
        # $http_connection passes "Upgrade" through for websocket requests
        # and "keep-alive" otherwise — no http-level `map` needed.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;

        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name bitwarden.example.com;
    return 301 https://$host$request_uri;
}
