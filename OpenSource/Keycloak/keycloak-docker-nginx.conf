# Keycloak reverse proxy.
#
# TLS is terminated here; Keycloak runs with --http-enabled=true
# --proxy-headers=xforwarded and is published on 127.0.0.1 only, so this vhost
# is the single public entry point.
#
# Placeholders auth.example.com and 127.0.0.1:8090 are substituted by
# keycloak-docker-install.sh. Edit them by hand if configuring Nginx separately.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;

    server_name auth.example.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/auth.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.example.com/privkey.pem;
    #include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer" always;
    # No X-Frame-Options here on purpose: Keycloak sends its own per-realm
    # frame-ancestors / X-Frame-Options (Realm settings -> Security defenses),
    # and a blanket header at this layer would override it.

    # Headroom for realm partial-imports through the admin console.
    client_max_body_size 20m;
    # OIDC/SAML redirects carry long query strings and Keycloak's session
    # cookies are large — the 8k default here rejects them with a 400.
    large_client_header_buffers 4 32k;

    location / {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Same size problem in the other direction: a response carrying several
        # Set-Cookie headers mid-login overflows the default proxy buffers and
        # Nginx answers 502 with "upstream sent too big header".
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name auth.example.com;
    return 301 https://$host$request_uri;
}
