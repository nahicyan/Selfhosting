# Host nginx reverse proxy for the self-hosted ntfy server used by the GraphenePush Rocket.Chat
# App (see README.md, Goal-One). This runs on the host's own nginx alongside your existing
# Rocket.Chat vhost - it is NOT part of the docker compose stack and there is no Traefik/other
# containerized proxy involved anywhere in this setup.
#
# ntfy itself only listens on 127.0.0.1:8090 (NTFY_BIND_IP/NTFY_HOST_PORT in .env, see
# docker-compose-rc-notification.yml) - this vhost is the only thing that exposes it publicly.
#
# The proxy_* settings below are copied from ntfy's own documented nginx guidance and are not
# optional extras: Instant Delivery (the long-lived streaming subscription that lets the ntfy
# Android app receive pushes without Google/FCM) and attachment uploads both break under default
# nginx buffering/timeouts. See: https://docs.ntfy.sh/config/#nginx-reverse-proxy
#
# Before enabling:
#   1. Point ntfy.your-domain.com's DNS at this host.
#   2. Replace every "ntfy.your-domain.com" below with your real subdomain.
#   3. Obtain a certificate, e.g.: sudo certbot certonly --nginx -d ntfy.your-domain.com
#      (or --webroot -w /var/www/html if you prefer not to let certbot edit nginx configs).
#   4. Symlink/copy this file into your nginx site config (e.g. /etc/nginx/sites-available/ +
#      sites-enabled/, or conf.d/ depending on your distro), matching however your existing
#      Rocket.Chat vhost is set up.
#   5. sudo nginx -t && sudo systemctl reload nginx

server {
	listen 80;
	listen [::]:80;
	server_name ntfy.your-domain.com;

	# Keep HTTP-01 renewals working even though everything else redirects to https.
	location /.well-known/acme-challenge/ {
		root /var/www/html;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name ntfy.your-domain.com;

	ssl_certificate     /etc/letsencrypt/live/ntfy.your-domain.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/ntfy.your-domain.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	# If your other vhosts already `include` a shared certbot ssl-options/dhparam snippet,
	# swap it in here too instead of the two lines above - this file just needs *some* modern
	# TLS config, it doesn't need to be this exact one.

	# ntfy enforces its own attachment size limit server-side; this just stops nginx from
	# rejecting a large upload before ntfy gets a chance to.
	client_max_body_size 0;

	location / {
		proxy_pass http://127.0.0.1:8090;
		proxy_http_version 1.1;

		# Required for Instant Delivery (streaming subscriptions) and the ntfy web app's
		# websocket endpoint - buffering would delay or silently break real-time push delivery.
		proxy_buffering off;
		proxy_request_buffering off;
		proxy_redirect off;

		proxy_set_header Host $host;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_connect_timeout 3m;
		proxy_send_timeout 3m;
		proxy_read_timeout 3m;
	}
}
