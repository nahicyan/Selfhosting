services:
  ntfy:
    image: docker.io/binwiederhier/ntfy:${NTFY_VERSION:-latest}
    restart: always
    command: serve
    environment:
      TZ: ${TZ:-UTC}
      NTFY_BASE_URL: "https://${NTFY_DOMAIN:-ntfy.localhost}"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: "${NTFY_CACHE_DURATION:-12h}"
      NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      # deny-all: topics are only readable/writable by users granted access below (see README).
      NTFY_AUTH_DEFAULT_ACCESS: "${NTFY_AUTH_DEFAULT_ACCESS:-deny-all}"
      NTFY_ENABLE_SIGNUP: "false"
      NTFY_ENABLE_LOGIN: "true"
    volumes:
      - ntfy_data:/var/lib/ntfy
    # Bound to loopback only: your host's own nginx (see ../ntfy-rocketchat-nginx.conf) is what
    # terminates TLS and exposes this to the internet, proxying to 127.0.0.1:NTFY_HOST_PORT. There
    # is no other reverse proxy (containerized or otherwise) involved in this setup.
    ports:
      - "${NTFY_BIND_IP:-127.0.0.1}:${NTFY_HOST_PORT:-8090}:80"
    # healthcheck:
    #   test: ["CMD", "wget", "-q", "--tries=1", "-O", "-", "http://localhost:80/v1/health"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 10
    #   start_period: 30s
    logging:
      driver: "journald"
      options:
        tag: "${COMPOSE_PROJECT_NAME:-rocketchat}#ntfy#{{.Name}}"

volumes:
  ntfy_data: {driver: local}
