# Supabase self-hosted reverse proxy.
#
# Supabase's official docker/ ships its own nginx/caddy containers for TLS
# termination (docker-compose.nginx.yml / docker-compose.caddy.yml), but
# every app in this repo is fronted by a host Nginx vhost instead, so those
# overrides are never enabled here. The single api-gw service (Envoy by
# default) already reverse-proxies everything behind it - Studio, Auth,
# REST, Realtime, Storage, Functions, MCP, SSO - on one port, including
# basic-auth on the dashboard route (DASHBOARD_USERNAME/PASSWORD in .env),
# so this vhost only ever needs to reach that one port. api-gw is published
# on 127.0.0.1 only (see docker-compose.override.yml, written by
# supabase-docker-install.sh), so this vhost is the single public entry point.
#
# Buffer sizes below match Supabase's own template
# (volumes/proxy/nginx/supabase-nginx.conf.tpl): auth cookies/JWTs can be
# large enough to 502 at the gateway without them.
#
# Placeholders supabase.example.com and 127.0.0.1:8000 are substituted by
# supabase-docker-install.sh. Edit them by hand if configuring Nginx
# separately.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name supabase.example.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/supabase.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supabase.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Storage uploads - no fixed limit here; Storage/api-gw enforce their own.
    client_max_body_size 0;

    # Auth cookies and JWTs can be large; undersized buffers 502 at the gateway.
    large_client_header_buffers 4 16k;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket upgrade - required for Realtime (/realtime/v1/*).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;

        # Realtime holds its websocket open indefinitely; don't cull it as idle.
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name supabase.example.com;

    return 301 https://$host$request_uri;
}
