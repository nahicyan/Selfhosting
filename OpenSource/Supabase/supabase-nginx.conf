# Supabase self-hosted reverse proxy.
#
# Supabase's own docs document this exact setup under "Using a different
# reverse proxy?" in self-hosted-proxy-https.mdx: proxy to the API gateway
# on its published port, enable WebSocket support, forward X-Forwarded
# headers, and point SUPABASE_PUBLIC_URL/API_EXTERNAL_URL/SITE_URL at the
# HTTPS URL - which is exactly what supabase-docker-install.sh does to
# .env. Every app in this repo is fronted by a host Nginx vhost rather than
# a container, so Supabase's own dockerized nginx/caddy overrides
# (docker-compose.nginx.yml / .caddy.yml) are never enabled here.
#
# Headers, locations and buffer sizes below are adapted 1:1 from Supabase's
# own template (volumes/proxy/nginx/supabase-nginx.conf.tpl in the
# self-hosted docker/ tree). The one structural difference: that template
# splits traffic between two Docker service names - studio:3000 for the
# dashboard, api-gw:8000 for everything else - because it runs inside the
# same Docker network as both. A host Nginx vhost isn't on that network and
# can only reach api-gw's published port, so every location below proxies
# there instead. This isn't a loss: api-gw's own catch-all route already
# forwards unmatched paths (including the dashboard) to Studio internally,
# dashboard basic-auth included (DASHBOARD_USERNAME/PASSWORD in .env) - see
# the "dashboard-all" route in kong.yml, or the studio cluster routes in
# envoy's lds.template.yaml for the default Envoy gateway.
#
# Placeholders supabase.example.com and 127.0.0.1:8000 are substituted by
# supabase-docker-install.sh. Edit them by hand if configuring Nginx
# separately.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name supabase.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/supabase.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supabase.example.com/privkey.pem;
    #include /etc/letsencrypt/options-ssl-nginx.conf;
    #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Prevent 502 errors from large Supabase auth cookies - same rationale
    # and values as Supabase's own nginx template.
    large_client_header_buffers 4 16k;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Everything except Realtime and Storage below: Studio, Auth, REST,
    # GraphQL, Functions, MCP, SSO. All reachable through api-gw the same
    # way, so - unlike the upstream template - they don't need their own
    # location blocks; nothing about them differs from this catch-all.
    location / {
        proxy_pass http://127.0.0.1:8000;
    }

    location /realtime/v1/ {
        proxy_pass http://127.0.0.1:8000;

        # A location that sets its own proxy_set_header stops inheriting the
        # server-level ones (nginx's array-directive scoping rule), so they
        # have to be repeated here alongside the WebSocket upgrade headers -
        # matching Supabase's own template exactly.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Realtime holds its websocket open indefinitely; don't cull it as idle.
        proxy_read_timeout 3600s;
    }

    location /storage/v1/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_buffering off;
        proxy_request_buffering off;

        chunked_transfer_encoding off;

        # No fixed limit here; Storage/api-gw enforce their own.
        client_max_body_size 0;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name supabase.example.com;

    return 301 https://$host$request_uri;
}
