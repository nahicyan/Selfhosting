server {
    listen 80;
    listen [::]:80;
    server_name matrix.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    listen 8448 ssl http2;
    listen [::]:8448 ssl http2;
    server_name matrix.example.com;

    ssl_certificate /etc/letsencrypt/live/matrix.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # MAS compat layer – MUST come before the general /_matrix block
    location ~ ^(/_matrix/client/(v3|r0|unstable)/(login|logout|refresh)) {
        proxy_pass http://localhost:8086;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host:$server_port;
        proxy_http_version 1.1;
        # Must match max_upload_size in homeserver.yaml
        client_max_body_size 131072M;
    }

    # SECURITY: /_synapse/admin exposes the Synapse Admin API. Synapse's docs
    # recommend not exposing it to the public internet without good reason.
    # Uncomment and adjust to restrict it to trusted IPs:
    #   satisfy all;
    #   allow 203.0.113.0/24;
    #   deny all;
    # All other Matrix / Synapse admin endpoints go to Synapse
    location ~ ^(/_matrix/client/v1/rendezvous|/_matrix/client/v3/login_with_qr|/_synapse/client|/_synapse/admin|/_matrix) {
        proxy_pass http://localhost:8008;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host:$server_port;
        # Synapse responses may be chunked, which is an HTTP/1.1 feature.
        proxy_http_version 1.1;
        # Must match max_upload_size in homeserver.yaml
        client_max_body_size 131072M;
    }

    # Well-known: homeserver, MAS OIDC issuer, and RTC foci for Element Call
    location /.well-known/matrix/client {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        return 200 '{"m.homeserver":{"base_url":"https://matrix.example.com"},"org.matrix.msc2965.authentication":{"issuer":"https://auth.example.com/","account":"https://auth.example.com/account"},"org.matrix.msc4143.rtc_foci":[{"type":"livekit","livekit_service_url":"https://rtc.example.com/livekit/jwt"}]}';
    }

    location /.well-known/matrix/server {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        return 200 '{"m.server":"matrix.example.com:443"}';
    }

    location /.well-known/element/element.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
        return 200 '{"call":{"widget_url":"https://call.element.io"}}';
    }
}
