# Outline reverse proxy.
#
# Based on the official example (outline/temp/nginx.txt), split into a
# redirect + TLS-terminating pair to match the certbot-managed style used
# throughout this repo. TLS is terminated here; Outline runs in Docker,
# published on 127.0.0.1 only (see docker-compose.yml), so this vhost is the
# single public entry point. WebSockets must work — real-time collaborative
# editing (Y.js) runs over them, not just the "document updated" live UI.
#
# Placeholders outline.example.com and 127.0.0.1:3000 are substituted by
# outline-docker-install.sh. Edit them by hand if configuring Nginx
# separately.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name outline.example.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/outline.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/outline.example.com/privkey.pem;
    #include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # No X-Frame-Options here on purpose: Outline sets its own via helmet()
    # and overrides it per-route (server/routes/embeds.ts), so a blanket
    # header here would fight the app's own embedding policy.

    # Headroom above FILE_STORAGE_UPLOAD_MAX_SIZE in .env (default 250MB).
    # Raise both together if you increase the upload limit.
    client_max_body_size 300m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket upgrade — required for the Y.js collaboration engine.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Scheme $scheme;
        proxy_redirect off;

        # Collaborative editing streams over an idle-but-open websocket;
        # don't let Nginx buffer it or cull it as "idle".
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name outline.example.com;
    return 301 https://$host$request_uri;
}
