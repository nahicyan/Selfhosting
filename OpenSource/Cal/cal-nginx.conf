# Cal.diy reverse proxy.
#
# TLS is terminated here. Cal.diy runs in Docker, published on 127.0.0.1 only
# (see docker-compose.yml and CAL_PORT in .env), so this vhost is the single
# public entry point. The container speaks plain HTTP; the public https:// URL
# is carried by NEXT_PUBLIC_WEBAPP_URL and NEXTAUTH_URL in .env.
#
# Placeholders cal.example.com and 127.0.0.1:3000 are substituted by
# cal-docker-install.sh. Edit them by hand if configuring Nginx separately.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name cal.example.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/cal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cal.example.com/privkey.pem;
    #include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # No X-Frame-Options here on purpose: booking pages are meant to be embedded
    # in other sites (Cal.diy's embed snippet), and Cal.diy manages its own
    # framing policy (CSP_POLICY in .env). A blanket header here would break
    # every embed.

    # Avatar and logo uploads (Nginx's own default is 1m).
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Harmless for plain requests; keeps any WebSocket feature working.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name cal.example.com;
    return 301 https://$host$request_uri;
}
