# EspoCRM reverse proxy.
#
# TLS is terminated here. EspoCRM runs in Docker, published on 127.0.0.1 only
# (see docker-compose.yml and ESPOCRM_PORT / ESPOCRM_WS_PORT in .env), so this
# vhost is the single public entry point. Two upstreams:
#   127.0.0.1:8100  the espocrm container (Apache + PHP, plain HTTP)
#   127.0.0.1:8101  the espocrm-websocket container (plain ws://)
#
# /wss is the path EspoCRM's client connects to for an https:// site URL, and
# the one EspoCRM's own Nginx config and official installer use. The compose
# file also sets webSocketUrl to wss://<domain>/wss, so it is explicit.
#
# Placeholders crm.example.com, 127.0.0.1:8100 and 127.0.0.1:8101 are
# substituted by espocrm-docker-install.sh. Edit them by hand if configuring
# Nginx separately.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name crm.example.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/crm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.com/privkey.pem;
    #include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # EspoCRM sends HSTS and nosniff itself, but only on its HTML pages. The
    # upstream copies are hidden in "location /" so these apply to every response
    # (API, static files, downloads) without duplicate headers.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # No X-Frame-Options on purpose: EspoCRM sends a CSP frame-ancestors of its
    # own, configurable for embedding web-to-lead forms and portals in other
    # sites. A blanket header here would override that.

    # Matches the image's PHP limits (upload_max_filesize / post_max_size = 50M)
    # and EspoCRM's official installer. Raising it here alone does nothing;
    # Nginx's own default (1m) would reject most attachments.
    client_max_body_size 50M;

    # WebSocket. Nginx closes idle proxied connections after 60s by default,
    # which would drop every client's socket, so keep them open for 12h
    # (EspoCRM's documented value).
    location /wss {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        # EspoCRM reads the client address from this header
        # (ESPOCRM_CONFIG_IP_ADDRESS_SERVER_PARAM=HTTP_X_REAL_IP in
        # docker-compose.yml) for its auth log and failed-login limit. Setting it
        # here also overwrites anything a client sends.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;

        # Imports, exports, mass email and rebuilds can run long. PHP's own
        # max_execution_time in the image is 180s.
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name crm.example.com;
    return 301 https://$host$request_uri;
}
