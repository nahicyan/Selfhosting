# Coder reverse proxy.
#
# TLS is terminated here. Coder runs in Docker, published on 127.0.0.1 only
# (see compose.yaml), so this vhost is the single public entry point. It speaks
# plain HTTP to the container and needs WebSockets: workspace connections, the
# web terminal, dashboard port-forwarding and the DERP relay all run over them.
#
# Adapted from the upstream guide, kept in this repo's vhost style:
#   https://coder.com/docs/tutorials/reverse-proxy-nginx
#
# Placeholders coder.example.com and 127.0.0.1:7080 are substituted by
# coder-docker-install.sh. Edit them by hand if configuring Nginx separately.
#
# Workspace apps on subpaths and dashboard port-forwarding need a wildcard
# access URL (CODER_WILDCARD_ACCESS_URL). To serve it from this vhost, add the
# wildcard to server_name in both blocks below, e.g.
#     server_name coder.example.com *.coder.example.com;
# and install a certificate that also covers *.coder.example.com (DNS-01
# challenge - certbot --nginx -d coder.example.com does not issue wildcards).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name coder.example.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/coder.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coder.example.com/privkey.pem;
    #include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer" always;
    # No X-Frame-Options here on purpose: workspace apps such as code-server are
    # embedded in the Coder dashboard in an iframe, and a blanket DENY at this
    # layer would break them.

    # Template pushes (`coder templates push`) and CLI uploads go through the
    # API. Raise if your templates carry large embedded assets.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:7080;
        proxy_http_version 1.1;

        # WebSocket upgrade - required, not optional, for Coder. The relay also
        # uses an "Upgrade: derp" handshake; forwarding $http_upgrade verbatim
        # covers both. If a proxy on the path still mangles it, set
        # CODER_DERP_FORCE_WEBSOCKETS=true on the Coder server.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Build logs, the web terminal and agent streams are long-lived and
        # incremental - don't buffer them, and don't cull idle sockets.
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_redirect off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name coder.example.com;
    return 301 https://$host$request_uri;
}
