# code-server reverse proxy.
#
# TLS is terminated here. code-server runs in Docker, published on 127.0.0.1
# only (see docker-compose.yml), so this vhost is the single public entry point.
# It speaks plain HTTP to the container and needs WebSockets to work — the VS
# Code UI, the integrated terminal and the extension host all run over them.
#
# Placeholders code.example.com and 127.0.0.1:8080 are substituted by
# code-server-docker-install.sh. Edit them by hand if configuring Nginx
# separately.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name code.example.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/code.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/code.example.com/privkey.pem;
    #include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer" always;
    # No X-Frame-Options here on purpose: code-server sends its own framing
    # headers, and it is sometimes embedded deliberately (e.g. in Coder).

    # Drag-and-drop uploads into the editor. Raise if you move larger files.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket upgrade — required, not optional, for code-server.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # $http_host (not $host) so code-server shows the real external address
        # in the bottom-left status bar.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Accept-Encoding gzip;

        # Terminal output and the extension host stream; don't sit on it.
        proxy_buffering off;

        # Long-lived idle WebSockets (an editor left open) must not be culled.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_redirect off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name code.example.com;
    return 301 https://$host$request_uri;
}
