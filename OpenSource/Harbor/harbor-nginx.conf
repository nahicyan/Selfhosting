# Harbor reverse proxy.
#
# TLS is terminated here. Harbor's own Nginx (the "proxy" service, container
# "nginx") speaks plain HTTP and is published on 127.0.0.1 only: the installer
# sets http.port to "127.0.0.1:<port>", comments out the https block and sets
# external_url to https://<domain> in harbor.yml - Harbor's documented setup
# for running behind a proxy that terminates TLS.
#
# Placeholders harbor.example.com and 127.0.0.1:8095 are substituted by
# harbor-docker-install.sh. Edit them by hand if configuring Nginx separately.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name harbor.example.com;

    ssl_certificate /etc/letsencrypt/live/harbor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/harbor.example.com/privkey.pem;
    #include /etc/letsencrypt/options-ssl-nginx.conf;
    #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Harbor's Nginx already sends X-Frame-Options and a frame-ancestors CSP.
    # It only sends HSTS in its own HTTPS mode, which is off here.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Image layers can be several GB - no request size limit, or pushes fail
    # with 413. Chunked uploads are how Docker clients push layers (411 without).
    client_max_body_size 0;
    chunked_transfer_encoding on;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Harbor's Nginx passes this on to core and the registry. Without it
        # they think the request came in over http and hand Docker clients
        # http:// upload and redirect URLs.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream layers through in both directions instead of spooling them to
        # disk first - the same settings Harbor's own Nginx uses for /v2/.
        proxy_buffering off;
        proxy_request_buffering off;

        # Large layer pushes and pulls can run long.
        proxy_connect_timeout 300;
        proxy_send_timeout 900;
        proxy_read_timeout 900;
        send_timeout 900;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name harbor.example.com;
    return 301 https://$host$request_uri;
}
